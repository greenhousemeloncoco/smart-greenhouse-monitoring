<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — Smart Greenhouse Monitoring System</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../css/login.css">
</head>
<body>

<!-- Animated Background -->
<div class="bg-grid"></div>
<div class="bg-particles" id="particles"></div>

<!-- Floating Leaves -->
<div class="leaf leaf-1">🌿</div>
<div class="leaf leaf-2">🍃</div>
<div class="leaf leaf-3">🌱</div>
<div class="leaf leaf-4">🍀</div>

<div class="login-wrapper">
    <!-- Logo Section -->
    <div class="brand-section">
        <div class="brand-logo">
            <div class="logo-ring">
                <div class="logo-inner">
                    <i class="fas fa-seedling"></i>
                </div>
            </div>
        </div>
        <div class="brand-text">
            <h1 class="brand-title">SMART GREENHOUSE</h1>
            <p class="brand-subtitle">MONITORING SYSTEM</p>
            <div class="brand-tag">
                <span class="dot"></span>
                IoT Powered · ESP32
                <span class="dot"></span>
            </div>
        </div>
    </div>

    <!-- Login Card -->
    <div class="login-card">
        <div class="card-header">
            <div class="status-bar">
                <span class="status-dot online"></span>
                <span class="status-text">SYSTEM ONLINE</span>
                <span class="status-time" id="currentTime">00:00:00</span>
            </div>
            <h2 class="card-title">ADMIN ACCESS</h2>
            <p class="card-sub">Masukkan kredensial untuk melanjutkan</p>
        </div>

        <form class="login-form" id="loginForm">
            <div class="input-group">
                <label class="input-label">
                    <i class="fas fa-user-shield"></i> USERNAME
                </label>
                <div class="input-wrapper">
                    <input type="text" id="username" class="form-input"
                           placeholder="admin" autocomplete="username">
                    <span class="input-line"></span>
                </div>
            </div>

            <div class="input-group">
                <label class="input-label">
                    <i class="fas fa-lock"></i> PASSWORD
                </label>
                <div class="input-wrapper">
                    <input type="password" id="password" class="form-input"
                           placeholder="••••••••" autocomplete="current-password">
                    <button type="button" class="toggle-pw" id="togglePw">
                        <i class="fas fa-eye" id="eyeIcon"></i>
                    </button>
                    <span class="input-line"></span>
                </div>
            </div>

            <div class="alert-box" id="alertBox" style="display:none"></div>

            <button type="submit" class="btn-login" id="loginBtn">
                <span class="btn-text">
                    <i class="fas fa-sign-in-alt"></i>
                    MASUK SISTEM
                </span>
                <span class="btn-loader" style="display:none">
                    <i class="fas fa-spinner fa-spin"></i> MEMVERIFIKASI...
                </span>
                <div class="btn-glow"></div>
            </button>
        </form>

        <div class="card-footer">
            <div class="security-badges">
                <span class="badge"><i class="fas fa-shield-alt"></i> SSL Secured</span>
                <span class="badge"><i class="fas fa-microchip"></i> ESP32 Ready</span>
                <span class="badge"><i class="fas fa-database"></i> MySQL</span>
            </div>
        </div>
    </div>

    <p class="footer-note">v1.0.0 &copy; 2024 Smart Greenhouse Systems</p>
</div>

<script>
// Time display
function updateTime() {
    const now = new Date();
    document.getElementById('currentTime').textContent =
        now.toLocaleTimeString('id-ID', { hour12: false });
}
setInterval(updateTime, 1000);
updateTime();

// Particles
const container = document.getElementById('particles');
for (let i = 0; i < 30; i++) {
    const p = document.createElement('div');
    p.className = 'particle';
    p.style.cssText = `
        left:${Math.random()*100}%;
        top:${Math.random()*100}%;
        animation-delay:${Math.random()*6}s;
        animation-duration:${4+Math.random()*4}s;
        width:${2+Math.random()*4}px;
        height:${2+Math.random()*4}px;
        opacity:${0.1+Math.random()*0.4}
    `;
    container.appendChild(p);
}

// Toggle password
document.getElementById('togglePw').addEventListener('click', () => {
    const pw = document.getElementById('password');
    const icon = document.getElementById('eyeIcon');
    if (pw.type === 'password') {
        pw.type = 'text';
        icon.className = 'fas fa-eye-slash';
    } else {
        pw.type = 'password';
        icon.className = 'fas fa-eye';
    }
});

// Login form
document.getElementById('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const username = document.getElementById('username').value.trim();
    const password = document.getElementById('password').value;
    const btn      = document.getElementById('loginBtn');
    const alertBox = document.getElementById('alertBox');
    const btnText  = btn.querySelector('.btn-text');
    const btnLoader = btn.querySelector('.btn-loader');

    alertBox.style.display = 'none';
    btnText.style.display  = 'none';
    btnLoader.style.display = 'inline-flex';
    btn.disabled = true;

    try {
        const response = await fetch('/api/auth/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username, password })
        });
        const data = await response.json();

        if (data.success) {
            localStorage.setItem('gh_token', data.data.token);
            localStorage.setItem('gh_user', JSON.stringify(data.data.admin));
            btn.classList.add('success');
            btnLoader.innerHTML = '<i class="fas fa-check-circle"></i> BERHASIL! MENGALIHKAN...';
            setTimeout(() => window.location.href = '/dashboard', 1200);
        } else {
            alertBox.innerHTML = `<i class="fas fa-exclamation-triangle"></i> ${data.message || 'Login gagal'}`;
            alertBox.style.display = 'flex';
            alertBox.classList.add('shake');
            setTimeout(() => alertBox.classList.remove('shake'), 600);
            btnText.style.display  = 'inline-flex';
            btnLoader.style.display = 'none';
            btn.disabled = false;
        }
    } catch (err) {
        // Demo mode fallback
        if (username === 'admin' && password === 'admin123') {
            localStorage.setItem('gh_token', 'demo_token_greenhouse');
            localStorage.setItem('gh_user', JSON.stringify({ username: 'admin', full_name: 'Administrator' }));
            btnLoader.innerHTML = '<i class="fas fa-check-circle"></i> BERHASIL! MENGALIHKAN...';
            setTimeout(() => window.location.href = '/dashboard', 1200);
        } else {
            alertBox.innerHTML = `<i class="fas fa-wifi"></i> Server offline. Gunakan admin/admin123 untuk demo.`;
            alertBox.style.display = 'flex';
            btnText.style.display  = 'inline-flex';
            btnLoader.style.display = 'none';
            btn.disabled = false;
        }
    }
});

// Enter key
document.addEventListener('keydown', e => {
    if (e.key === 'Enter') document.getElementById('loginForm').requestSubmit();
});
</script>
</body>
</html>
